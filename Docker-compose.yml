version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    profiles: ["load-test"]
    networks:
      - monitoring
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nolzo}
      MYSQL_USER: ${MYSQL_USERNAME:-nolzo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
    ports:
      - "3307:3306"
    networks:
      - monitoring
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10

  springboot:
    build: .
    container_name: springboot
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - monitoring
    environment:
      QUEUE_RECOVERY_TEST_ENABLED: ${QUEUE_RECOVERY_TEST_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      MYSQL_DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nolzo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
      MYSQL_USERNAME: ${MYSQL_USERNAME:-nolzo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-that-must-not-be-used-in-production-123456}
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8080 > /dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  k6:
    image: loadimpact/k6
    container_name: k6
    platform: linux/amd64
    profiles: ["load-test"]
    depends_on:
      springboot:
        condition: service_healthy
    networks:
      - monitoring
    command: [ "run", "/test.js" ]
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    volumes:
      - ./k6/test.js:/test.js

  k6-queue-recovery-gc:
    image: loadimpact/k6
    container_name: k6-queue-recovery-gc
    platform: linux/amd64
    profiles:
      - gc-test
    depends_on:
      springboot:
        condition: service_healthy
    networks:
      - monitoring
    command: [ "run", "/scripts/queue-recovery-gc-test.js" ]
    environment:
      BASE_URL: http://springboot:8080
      TRAFFIC_VUS: ${TRAFFIC_VUS:-20}
      TRAFFIC_DURATION: ${TRAFFIC_DURATION:-60s}
      K6_OUT: influxdb=http://influxdb:8086/k6
    volumes:
      - ./k6:/scripts

  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
