spring:
  config.activate.on-profile: "test"
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    producer:
      acks: all
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        spring.json.add.type.headers: false
    consumer:
      group-id: test-seat-available-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.noljo.nolzo.notification.adapter.message
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nolzo;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: "test-only-secret-key-that-is-long-enough-for-hmac-signing-1234567890"

security:
  jwt:
    secret-key: "alfknmeanfgaeownfewalf.afklneaflneaiofnaeoifnewanfea.afofineaoifnanfeakngalneg"
    expire-length: 36000

app:
  kafka:
    admin:
      enabled: false
    consumer:
      enabled: false
      group-id: test-seat-available-group
    topics:
      seat-available: seat-available-events
      notification-batch-request: notification-batch-requests
      dlt:
        seat-available: seat-available-events-dlt
        notification-batch-request: notification-batch-requests-dlt
    topic:
      partitions:
        seat-available: 1
        notification-batch-request: 1
        dlt: 1
      replicas:
        seat-available: 1
        notification-batch-request: 1
        dlt: 1
    error:
      retry-attempts: 1
      initial-interval-ms: 100
      multiplier: 2.0
      max-interval-ms: 500
  notification:
    batch-size: 2
    cooldown-minutes: 10
    retry-attempts: 3
  outbox:
    publish:
      batch-size: 10
      fixed-delay-ms: 3000
