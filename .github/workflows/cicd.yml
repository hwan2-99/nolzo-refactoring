name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: nolzo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run tests
        run: bash gradlew test --no-daemon

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: [self-hosted, Linux, X64, nolzo-prod]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync deployment source
        run: |
          rsync -a --delete \
            --exclude=.git/ \
            --exclude=.github/ \
            --exclude=.gradle/ \
            --exclude=.env \
            --exclude=.env.production \
            --exclude='*/build/' \
            ./ /opt/nolzo/

      - name: Deploy on EC2
        working-directory: /opt/nolzo
        run: bash scripts/deploy.sh
