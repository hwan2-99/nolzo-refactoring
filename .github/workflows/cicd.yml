name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: nolzo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run tests
        run: bash gradlew test --no-daemon

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Package deployment source
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gradle \
            --exclude=.env \
            --exclude=.env.production \
            --exclude='*/build' \
            --exclude='*.tar.gz' \
            -czf "${RUNNER_TEMP}/nolzo-deploy.tar.gz" .
          mv "${RUNNER_TEMP}/nolzo-deploy.tar.gz" nolzo-deploy.tar.gz

      - name: Upload deployment source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: nolzo-deploy.tar.gz
          target: /tmp

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 20m
          script: |
            mkdir -p /opt/nolzo
            tar -xzf /tmp/nolzo-deploy.tar.gz -C /opt/nolzo
            rm -f /tmp/nolzo-deploy.tar.gz
            cd /opt/nolzo
            bash scripts/deploy.sh
